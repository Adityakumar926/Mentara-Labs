<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Robot Blue Clay Gradient -->
    <radialGradient id="robotBody" cx="36%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="22%" stop-color="#E2F2FC" />
      <stop offset="55%" stop-color="#89C8F5" />
      <stop offset="85%" stop-color="#4F9DD6" />
      <stop offset="100%" stop-color="#367AA8" />
    </radialGradient>

    <!-- Screen Bezel & Face -->
    <linearGradient id="screenBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D9EFFC" />
      <stop offset="100%" stop-color="#B3DCF7" />
    </linearGradient>

    <linearGradient id="screenInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2FAFD" />
      <stop offset="100%" stop-color="#D7EFFC" />
    </linearGradient>

    <!-- Butter-Yellow Gear 3D -->
    <linearGradient id="gearYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="35%" stop-color="#F6CE65" />
      <stop offset="75%" stop-color="#DE9E28" />
      <stop offset="100%" stop-color="#B5760E" />
    </linearGradient>

    <!-- Lavender Gear 3D -->
    <linearGradient id="gearPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4ECFD" />
      <stop offset="35%" stop-color="#C29CF5" />
      <stop offset="75%" stop-color="#8F59DE" />
      <stop offset="100%" stop-color="#6528B8" />
    </linearGradient>

    <!-- Lab Table Block -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAE4FF" />
      <stop offset="100%" stop-color="#B8A7E8" />
    </linearGradient>

    <filter id="robotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A5568" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="172" rx="60" ry="12" fill="#4A5568" opacity="0.12" />

  <!-- 1. LEFT PURPLE GEAR (Tilted 3D Bevel) -->
  <g transform="translate(42, 108) rotate(14)" filter="url(#robotShadow)">
    <circle cx="0" cy="0" r="24" fill="url(#gearPurple)" />
    <!-- Gear Teeth -->
    <rect x="-6" y="-30" width="12" height="12" rx="3" fill="url(#gearPurple)" />
    <rect x="-6" y="18" width="12" height="12" rx="3" fill="url(#gearPurple)" />
    <rect x="-30" y="-6" width="12" height="12" rx="3" fill="url(#gearPurple)" />
    <rect x="18" y="-6" width="12" height="12" rx="3" fill="url(#gearPurple)" />
    <g transform="rotate(45)">
      <rect x="-6" y="-30" width="12" height="12" rx="3" fill="url(#gearPurple)" />
      <rect x="-6" y="18" width="12" height="12" rx="3" fill="url(#gearPurple)" />
      <rect x="-30" y="-6" width="12" height="12" rx="3" fill="url(#gearPurple)" />
      <rect x="18" y="-6" width="12" height="12" rx="3" fill="url(#gearPurple)" />
    </g>
    <!-- Gear Core -->
    <circle cx="0" cy="0" r="10" fill="#FAF8F4" stroke="#8F59DE" stroke-width="2.5" />
    <!-- Top Highlight -->
    <circle cx="-5" cy="-6" r="4" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- 2. RIGHT YELLOW GEAR (Tilted 3D Bevel) -->
  <g transform="translate(158, 114) rotate(-18)" filter="url(#robotShadow)">
    <circle cx="0" cy="0" r="22" fill="url(#gearYellow)" />
    <!-- Gear Teeth -->
    <rect x="-5" y="-28" width="10" height="11" rx="3" fill="url(#gearYellow)" />
    <rect x="-5" y="17" width="10" height="11" rx="3" fill="url(#gearYellow)" />
    <rect x="-28" y="-5" width="11" height="10" rx="3" fill="url(#gearYellow)" />
    <rect x="17" y="-5" width="11" height="10" rx="3" fill="url(#gearYellow)" />
    <g transform="rotate(45)">
      <rect x="-5" y="-28" width="10" height="11" rx="3" fill="url(#gearYellow)" />
      <rect x="-5" y="17" width="10" height="11" rx="3" fill="url(#gearYellow)" />
      <rect x="-28" y="-5" width="11" height="10" rx="3" fill="url(#gearYellow)" />
      <rect x="17" y="-5" width="11" height="10" rx="3" fill="url(#gearYellow)" />
    </g>
    <!-- Gear Core -->
    <circle cx="0" cy="0" r="8" fill="#FAF8F4" stroke="#DE9E28" stroke-width="2.5" />
    <circle cx="-4" cy="-5" r="3" fill="#FFFFFF" opacity="0.7" />
  </g>

  <!-- 3. LAB TABLE / BASE BLOCKS -->
  <rect x="74" y="148" width="52" height="18" rx="6" fill="url(#tableGrad)" />
  <rect x="62" y="152" width="22" height="14" rx="4" fill="#6EE7B7" opacity="0.8" />
  <rect x="116" y="152" width="22" height="14" rx="4" fill="#C4B5FD" opacity="0.8" />

  <!-- 4. ROBOT TORSO & HANDS -->
  <rect x="84" y="128" width="32" height="26" rx="8" fill="url(#robotBody)" filter="url(#robotShadow)" />
  <!-- Hands Resting on Blocks -->
  <circle cx="70" cy="146" r="7" fill="#E2F2FC" stroke="#89C8F5" stroke-width="2" />
  <circle cx="130" cy="146" r="7" fill="#E2F2FC" stroke="#89C8F5" stroke-width="2" />

  <!-- 5. ROBOT HEAD -->
  <g filter="url(#robotShadow)">
    <!-- Antenna -->
    <rect x="97" y="38" width="6" height="16" rx="3" fill="#F6CE65" />
    <circle cx="100" cy="36" r="7" fill="#F6CE65" stroke="#DE9E28" stroke-width="1.5" />
    <circle cx="98" cy="34" r="2.5" fill="#FFFFFF" />

    <!-- Side Ear Caps (Pastel Peach) -->
    <rect x="63" y="78" width="10" height="22" rx="5" fill="#FCD2BE" stroke="#EAA684" stroke-width="1.5" />
    <rect x="127" y="78" width="10" height="22" rx="5" fill="#FCD2BE" stroke="#EAA684" stroke-width="1.5" />

    <!-- Head Helmet -->
    <rect x="68" y="50" width="64" height="60" rx="24" fill="url(#robotBody)" />
    <!-- Helmet Top Gloss -->
    <ellipse cx="94" cy="58" rx="20" ry="6" fill="#FFFFFF" opacity="0.5" />

    <!-- Screen Bezel -->
    <rect x="74" y="62" width="52" height="42" rx="14" fill="url(#screenBezel)" stroke="#FFFFFF" stroke-width="1.5" />
    <rect x="77" y="65" width="46" height="36" rx="11" fill="url(#screenInner)" />

    <!-- Blushing Cheeks -->
    <circle cx="83" cy="88" r="4" fill="#FCD2BE" />
    <circle cx="117" cy="88" r="4" fill="#FCD2BE" />

    <!-- Big Twinkling Robot Eyes -->
    <ellipse cx="88" cy="80" rx="4" ry="5" fill="#1A2433" />
    <ellipse cx="112" cy="80" rx="4" ry="5" fill="#1A2433" />
    <circle cx="87" cy="78" r="1.8" fill="#FFFFFF" />
    <circle cx="111" cy="78" r="1.8" fill="#FFFFFF" />

    <!-- Smiling Mouth -->
    <path d="M95 86 C97 91 103 91 105 86" stroke="#1A2433" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Sparkles -->
  <polygon points="172,64 175,70 182,72 175,75 172,82 170,75 163,72 170,70" fill="#F6CE65" />
  <circle cx="34" cy="78" r="3" fill="#C29CF5" />
</svg>
