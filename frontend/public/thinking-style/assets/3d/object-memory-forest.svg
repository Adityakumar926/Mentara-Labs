<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Crystal Facet Gradients: Refractive Violet & Magenta -->
    <linearGradient id="crystLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#C29BFA" />
      <stop offset="100%" stop-color="#7347C9" />
    </linearGradient>

    <linearGradient id="crystCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#E8CEFD" />
      <stop offset="60%" stop-color="#9E6DEB" />
      <stop offset="100%" stop-color="#5B29B8" />
    </linearGradient>

    <linearGradient id="crystRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8D2FC" />
      <stop offset="35%" stop-color="#8857D6" />
      <stop offset="100%" stop-color="#4E1E9E" />
    </linearGradient>

    <!-- Internal Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#8CE8FF" stop-opacity="0.75" />
      <stop offset="85%" stop-color="#BD74FC" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#BD74FC" stop-opacity="0" />
    </radialGradient>

    <!-- Pine Tree Foliage 3D Clay Lighting -->
    <linearGradient id="pineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5F2DC" />
      <stop offset="30%" stop-color="#78CFA5" />
      <stop offset="80%" stop-color="#3D9B6E" />
      <stop offset="100%" stop-color="#246B48" />
    </linearGradient>

    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C79268" />
      <stop offset="50%" stop-color="#9C6642" />
      <stop offset="100%" stop-color="#6E4023" />
    </linearGradient>

    <!-- Moss Mound Base -->
    <linearGradient id="mossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#AEE6C9" />
      <stop offset="70%" stop-color="#5EB58A" />
      <stop offset="100%" stop-color="#3E8F67" />
    </linearGradient>

    <filter id="crystShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A5568" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Ambient Shadow on Ground -->
  <ellipse cx="100" cy="172" rx="60" ry="12" fill="#4A5568" opacity="0.12" />

  <!-- 1. LEFT PINE TREE -->
  <g transform="translate(42, 70)" filter="url(#crystShadow)">
    <!-- Trunk -->
    <rect x="14" y="66" width="10" height="20" rx="3" fill="url(#trunkGrad)" />
    <!-- Bottom Tier -->
    <path d="M-2 70 C-2 58 8 52 19 50 C30 52 40 58 40 70 C40 76 -2 76 -2 70 Z" fill="url(#pineGrad)" />
    <!-- Middle Tier -->
    <path d="M2 52 C2 42 10 38 19 36 C28 38 36 42 36 52 C36 58 2 58 2 52 Z" fill="url(#pineGrad)" />
    <!-- Top Tier -->
    <path d="M6 38 C6 28 12 20 19 18 C26 20 32 28 32 38 C32 44 6 44 6 38 Z" fill="url(#pineGrad)" />
    <!-- Tip Highlight -->
    <circle cx="19" cy="22" r="3" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- 2. RIGHT PINE TREE -->
  <g transform="translate(120, 70)" filter="url(#crystShadow)">
    <!-- Trunk -->
    <rect x="14" y="66" width="10" height="20" rx="3" fill="url(#trunkGrad)" />
    <!-- Bottom Tier -->
    <path d="M-2 70 C-2 58 8 52 19 50 C30 52 40 58 40 70 C40 76 -2 76 -2 70 Z" fill="url(#pineGrad)" />
    <!-- Middle Tier -->
    <path d="M2 52 C2 42 10 38 19 36 C28 38 36 42 36 52 C36 58 2 58 2 52 Z" fill="url(#pineGrad)" />
    <!-- Top Tier -->
    <path d="M6 38 C6 28 12 20 19 18 C26 20 32 28 32 38 C32 44 6 44 6 38 Z" fill="url(#pineGrad)" />
    <!-- Tip Highlight -->
    <circle cx="19" cy="22" r="3" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- 3. MOSSY GROUND MOUND WITH SMALL FORESTRY STONES -->
  <ellipse cx="100" cy="156" rx="46" ry="14" fill="url(#mossGrad)" />
  <ellipse cx="78" cy="158" rx="10" ry="6" fill="#88CCA9" />
  <ellipse cx="124" cy="158" rx="9" ry="5" fill="#88CCA9" />
  <ellipse cx="100" cy="162" rx="14" ry="5" fill="#4B9E75" opacity="0.6" />

  <!-- 4. CENTRAL GLOWING CRYSTAL PRISM -->
  <g filter="url(#crystShadow)">
    <!-- Left Facet -->
    <polygon points="100,28 72,58 72,138 100,154" fill="url(#crystLeft)" />
    <!-- Center Main Front Facet -->
    <polygon points="100,28 88,58 88,142 100,154 112,142 112,58" fill="url(#crystCenter)" />
    <!-- Right Facet -->
    <polygon points="100,28 128,58 128,138 100,154" fill="url(#crystRight)" />
    <!-- Crystal Top Apex Highlight -->
    <polygon points="100,28 88,58 100,52" fill="#FFFFFF" opacity="0.85" />
    <polygon points="100,28 112,58 100,52" fill="#FFFFFF" opacity="0.5" />
    
    <!-- Internal Glowing Pulse Orb -->
    <ellipse cx="100" cy="98" rx="22" ry="34" fill="url(#coreGlow)" />
    <!-- Core White Sparkle -->
    <polygon points="100,86 103,96 113,99 103,102 100,112 97,102 87,99 97,96" fill="#FFFFFF" />
  </g>

  <!-- 5. Surrounding Small Crystal Spikes -->
  <polygon points="68,138 62,118 72,114 76,140" fill="#B794F4" opacity="0.9" />
  <polygon points="132,138 138,118 128,114 124,140" fill="#9F7AEA" opacity="0.8" />

  <!-- 6. Floating Golden Firefly Stars -->
  <g transform="translate(152, 38) scale(0.9)">
    <polygon points="10,0 13,7 20,10 13,13 10,20 7,13 0,10 7,7" fill="#F6E05E" />
    <circle cx="10" cy="10" r="2.5" fill="#FFFFFF" />
  </g>
  <g transform="translate(36, 46) scale(0.75)">
    <polygon points="10,0 13,7 20,10 13,13 10,20 7,13 0,10 7,7" fill="#F6E05E" />
    <circle cx="10" cy="10" r="2.5" fill="#FFFFFF" />
  </g>
  <circle cx="82" cy="42" r="2.5" fill="#FFF5A5" opacity="0.9" />
  <circle cx="120" cy="46" r="3" fill="#FFF5A5" opacity="0.9" />
</svg>
