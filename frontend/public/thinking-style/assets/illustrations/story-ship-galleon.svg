<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%" fill="none" role="img" aria-label="Story Ship Celestial Cloud Galleon">
  <defs>
    <linearGradient id="ssSky" x1="0" y1="0" x2="500" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3F8FE" />
      <stop offset="60%" stop-color="#DFEDFF" />
      <stop offset="100%" stop-color="#EAE4FF" stop-opacity="0.6" />
    </linearGradient>
    <filter id="ssShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2B7BC7" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="500" height="320" rx="20" fill="url(#ssSky)" />

  <!-- Fluffy Pastel Cloud Waves -->
  <!-- Back cloud layer -->
  <path d="M-20 270 Q40 230 110 250 T250 240 T380 255 T520 240 L520 320 L-20 320 Z" fill="#EAE4FF" opacity="0.6" />
  <!-- Front cloud sea -->
  <path d="M-10 285 Q60 255 140 275 T300 265 T440 280 T510 270 L510 320 L-10 320 Z" fill="#FFFFFF" opacity="0.9" filter="url(#ssShadow)" />

  <!-- The Celestial Story Galleon -->
  <g transform="translate(250, 155)" filter="url(#ssShadow)">
    <!-- Ship Hull (Curved Parchment Boat) -->
    <path d="M-85 30 Q-20 65 65 40 Q85 32 95 15 Q40 25 -75 18 Z" fill="#FFE4D6" stroke="#E07338" stroke-width="2.5" />
    <path d="M-65 24 Q0 38 65 22" stroke="#FFFFFF" stroke-width="2" fill="none" />

    <!-- Center Mast -->
    <line x1="5" y1="-85" x2="5" y2="35" stroke="#647184" stroke-width="3" stroke-linecap="round" />

    <!-- Main Sail: Shaped as an Open Storybook Page -->
    <!-- Left Sail Page -->
    <path d="M5 -75 Q-45 -55 -40 -10 Q-15 -18 5 -12 Z" fill="#FFFFFF" stroke="#2B7BC7" stroke-width="2" />
    <line x1="-30" y1="-42" x2="-8" y2="-40" stroke="#DFEDFF" stroke-width="2" stroke-linecap="round" />
    <line x1="-32" y1="-32" x2="-6" y2="-30" stroke="#DFEDFF" stroke-width="2" stroke-linecap="round" />
    <line x1="-28" y1="-22" x2="-8" y2="-20" stroke="#DFEDFF" stroke-width="2" stroke-linecap="round" />

    <!-- Right Sail Page -->
    <path d="M5 -75 Q55 -55 50 -10 Q25 -18 5 -12 Z" fill="#DDF5E9" stroke="#177A53" stroke-width="2" />
    <polygon points="26,-42 28,-37 33,-36 30,-33 31,-28 26,-30 22,-28 23,-33 20,-36 25,-37" fill="#FFF1BD" />

    <!-- Top Pennant Flag -->
    <polygon points="5,-85 35,-78 5,-71" fill="#FFE4D6" stroke="#E07338" stroke-width="1.5" />

    <!-- Bowsprit with Golden Star Lantern -->
    <line x1="90" y1="20" x2="115" y2="5" stroke="#647184" stroke-width="2" stroke-linecap="round" />
    <circle cx="118" cy="3" r="7" fill="#FFF1BD" stroke="#C78B12" stroke-width="1.5" />
  </g>

  <!-- Floating Story Speech & Clue Bubbles -->
  <g transform="translate(90, 80)" filter="url(#ssShadow)">
    <rect x="-35" y="-18" width="70" height="36" rx="14" fill="#FFFFFF" stroke="#2B7BC7" stroke-width="1.8" />
    <path d="M12 18 L18 26 L4 18 Z" fill="#FFFFFF" stroke="#2B7BC7" stroke-width="1.8" />
    <text x="0" y="5" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#2B7BC7" text-anchor="middle">Once...</text>
  </g>

  <g transform="translate(410, 75)" filter="url(#ssShadow)">
    <rect x="-40" y="-18" width="80" height="36" rx="14" fill="#FFF1BD" stroke="#C78B12" stroke-width="1.8" />
    <path d="M-12 18 L-18 26 L-4 18 Z" fill="#FFF1BD" stroke="#C78B12" stroke-width="1.8" />
    <text x="0" y="5" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#5C3D04" text-anchor="middle">...And then!</text>
  </g>
</svg>
