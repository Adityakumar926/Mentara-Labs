<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%" fill="none" role="img" aria-label="Friendship and Fairness Collaborative Balance Scales and Shared Building Blocks">
  <defs>
    <linearGradient id="ffBg" x1="0" y1="0" x2="500" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8F3" />
      <stop offset="50%" stop-color="#FFE4D6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#DDF5E9" stop-opacity="0.6" />
    </linearGradient>
    <filter id="ffShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#D95D3E" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="500" height="320" rx="20" fill="url(#ffBg)" />

  <!-- Center Collaboration Balance Scale -->
  <g transform="translate(250, 150)" filter="url(#ffShadow)">
    <!-- Central Pedestal / Pillar -->
    <polygon points="-24,100 24,100 8,-20 -8,-20" fill="#DDF5E9" stroke="#177A53" stroke-width="2.5" />
    <circle cx="0" cy="-20" r="14" fill="#FFE4D6" stroke="#E07338" stroke-width="2.5" />
    <circle cx="0" cy="-20" r="5" fill="#177A53" />

    <!-- Balance Beam (Horizontally Level - Equal and Fair) -->
    <rect x="-150" y="-25" width="300" height="10" rx="5" fill="#FFFFFF" stroke="#647184" stroke-width="2" />

    <!-- Left Pan (Supporting Shared Blocks for Friend 1) -->
    <line x1="-130" y1="-20" x2="-160" y2="40" stroke="#647184" stroke-width="1.8" />
    <line x1="-130" y1="-20" x2="-100" y2="40" stroke="#647184" stroke-width="1.8" />
    <path d="M-170 40 Q-130 55 -90 40 Z" fill="#EAE4FF" stroke="#7C5CDB" stroke-width="2" />
    <!-- 2 Shared Blocks in Left Pan -->
    <rect x="-144" y="22" width="16" height="16" rx="4" fill="#DDF5E9" stroke="#177A53" stroke-width="1.5" />
    <rect x="-124" y="22" width="16" height="16" rx="4" fill="#FFF1BD" stroke="#C78B12" stroke-width="1.5" />

    <!-- Right Pan (Supporting Equal Blocks for Friend 2) -->
    <line x1="130" y1="-20" x2="100" y2="40" stroke="#647184" stroke-width="1.8" />
    <line x1="130" y1="-20" x2="160" y2="40" stroke="#647184" stroke-width="1.8" />
    <path d="M90 40 Q130 55 170 40 Z" fill="#EAE4FF" stroke="#7C5CDB" stroke-width="2" />
    <!-- 2 Equal Shared Blocks in Right Pan -->
    <rect x="108" y="22" width="16" height="16" rx="4" fill="#FFF1BD" stroke="#C78B12" stroke-width="1.5" />
    <rect x="128" y="22" width="16" height="16" rx="4" fill="#DDF5E9" stroke="#177A53" stroke-width="1.5" />

    <!-- Equal Sign Heart Crest -->
    <circle cx="0" cy="40" r="18" fill="#FFF1BD" stroke="#C78B12" stroke-width="2" />
    <line x1="-7" y1="36" x2="7" y2="36" stroke="#293347" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-7" y1="44" x2="7" y2="44" stroke="#293347" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Left Friend Character Silhouette / Token -->
  <g transform="translate(60, 210)" filter="url(#ffShadow)">
    <circle cx="0" cy="-30" r="18" fill="#DFEDFF" stroke="#2B7BC7" stroke-width="2" />
    <path d="M-22 15 C-22 -8 22 -8 22 15 Z" fill="#DDF5E9" stroke="#177A53" stroke-width="2" />
    <circle cx="0" cy="-30" r="6" fill="#FFE4D6" />
    <text x="0" y="30" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#293347" text-anchor="middle">Kai</text>
  </g>

  <!-- Right Friend Character Silhouette / Token -->
  <g transform="translate(440, 210)" filter="url(#ffShadow)">
    <circle cx="0" cy="-30" r="18" fill="#FFE4D6" stroke="#E07338" stroke-width="2" />
    <path d="M-22 15 C-22 -8 22 -8 22 15 Z" fill="#EAE4FF" stroke="#7C5CDB" stroke-width="2" />
    <circle cx="0" cy="-30" r="6" fill="#FFF1BD" />
    <text x="0" y="30" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#293347" text-anchor="middle">Leo</text>
  </g>
</svg>
