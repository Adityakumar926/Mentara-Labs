<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%" fill="none" role="img" aria-label="Feelings Garden Expressive Emotional Blooms">
  <defs>
    <linearGradient id="fgSky" x1="0" y1="0" x2="500" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F9F6FE" />
      <stop offset="60%" stop-color="#EAE4FF" />
      <stop offset="100%" stop-color="#DDF5E9" stop-opacity="0.5" />
    </linearGradient>
    <filter id="fgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7C5CDB" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="500" height="320" rx="20" fill="url(#fgSky)" />

  <!-- Gentle Ground Mound -->
  <path d="M0 260 Q130 225 250 235 T500 240 L500 320 L0 320 Z" fill="#DDF5E9" opacity="0.8" />
  <path d="M0 280 Q180 255 350 265 T500 270 L500 320 L0 320 Z" fill="#C2EBD4" />

  <!-- Four Expressive Garden Flowers Representing Emotional Nuance -->

  <!-- Flower 1: The Joy Blossom (Butter Yellow / Peach) -->
  <g transform="translate(80, 195)" filter="url(#fgShadow)">
    <path d="M0 65 Q-5 30 0 0" stroke="#177A53" stroke-width="3.5" fill="none" />
    <path d="M-4 35 Q-20 28 -18 15 Q-5 25 -4 35" fill="#A1DDBE" stroke="#177A53" stroke-width="1.5" />
    <!-- Petals -->
    <circle cx="0" cy="-22" r="14" fill="#FFE4D6" stroke="#E07338" stroke-width="1.5" />
    <circle cx="0" cy="22" r="14" fill="#FFE4D6" stroke="#E07338" stroke-width="1.5" />
    <circle cx="-22" cy="0" r="14" fill="#FFE4D6" stroke="#E07338" stroke-width="1.5" />
    <circle cx="22" cy="0" r="14" fill="#FFE4D6" stroke="#E07338" stroke-width="1.5" />
    <circle cx="-15" cy="-15" r="13" fill="#FFF1BD" stroke="#C78B12" stroke-width="1.5" />
    <circle cx="15" cy="-15" r="13" fill="#FFF1BD" stroke="#C78B12" stroke-width="1.5" />
    <circle cx="-15" cy="15" r="13" fill="#FFF1BD" stroke="#C78B12" stroke-width="1.5" />
    <circle cx="15" cy="15" r="13" fill="#FFF1BD" stroke="#C78B12" stroke-width="1.5" />
    <!-- Expressive Smiling Face Center -->
    <circle cx="0" cy="0" r="16" fill="#FFF1BD" stroke="#C78B12" stroke-width="2" />
    <circle cx="-5" cy="-2" r="2" fill="#293347" />
    <circle cx="5" cy="-2" r="2" fill="#293347" />
    <path d="M-5 4 Q0 8 5 4" stroke="#293347" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <text x="0" y="80" font-family="'Nunito', sans-serif" font-weight="850" font-size="11" fill="#177A53" text-anchor="middle">Joy</text>
  </g>

  <!-- Flower 2: The Wonder Lily (Lavender / Star Bloom) -->
  <g transform="translate(195, 175)" filter="url(#fgShadow)">
    <path d="M0 85 Q8 40 0 0" stroke="#177A53" stroke-width="3.5" fill="none" />
    <path d="M3 45 Q22 40 18 25 Q4 35 3 45" fill="#A1DDBE" stroke="#177A53" stroke-width="1.5" />
    <!-- Star Lily Petals -->
    <polygon points="0,-32 10,-10 32,-10 14,4 20,26 0,12 -20,26 -14,4 -32,-10 -10,-10" fill="#EAE4FF" stroke="#7C5CDB" stroke-width="2" />
    <!-- Curious Wonder Eyes -->
    <circle cx="0" cy="0" r="15" fill="#FFFFFF" stroke="#7C5CDB" stroke-width="1.8" />
    <circle cx="-4" cy="-2" r="2.5" fill="#293347" />
    <circle cx="4" cy="-2" r="2.5" fill="#293347" />
    <circle cx="0" cy="5" r="2" fill="#7C5CDB" />
    <text x="0" y="100" font-family="'Nunito', sans-serif" font-weight="850" font-size="11" fill="#7C5CDB" text-anchor="middle">Curiosity</text>
  </g>

  <!-- Flower 3: The Calm Fern Flower (Mint & Powder Blue) -->
  <g transform="translate(310, 185)" filter="url(#fgShadow)">
    <path d="M0 75 Q-6 35 0 0" stroke="#177A53" stroke-width="3.5" fill="none" />
    <ellipse cx="-16" cy="-12" rx="14" ry="20" transform="rotate(-30 -16 -12)" fill="#DFEDFF" stroke="#2B7BC7" stroke-width="1.5" />
    <ellipse cx="16" cy="-12" rx="14" ry="20" transform="rotate(30 16 -12)" fill="#DFEDFF" stroke="#2B7BC7" stroke-width="1.5" />
    <ellipse cx="0" cy="-22" rx="14" ry="22" fill="#DDF5E9" stroke="#177A53" stroke-width="1.8" />
    <circle cx="0" cy="0" r="14" fill="#DDF5E9" stroke="#177A53" stroke-width="1.8" />
    <!-- Calm Closed Curved Eyes -->
    <path d="M-6 -2 Q-3 -5 0 -2" stroke="#293347" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M2 -2 Q5 -5 8 -2" stroke="#293347" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M-2 4 Q1 6 4 4" stroke="#293347" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <text x="0" y="90" font-family="'Nunito', sans-serif" font-weight="850" font-size="11" fill="#177A53" text-anchor="middle">Peaceful</text>
  </g>

  <!-- Flower 4: The Caring Heart Blossom (Peach / Coral) -->
  <g transform="translate(420, 190)" filter="url(#fgShadow)">
    <path d="M0 70 Q5 35 0 0" stroke="#177A53" stroke-width="3.5" fill="none" />
    <!-- Heart Petal Shape -->
    <path d="M0 16 C-24 -4 -32 -26 -14 -32 C-2 -34 0 -18 0 -18 C0 -18 2 -34 14 -32 C32 -26 24 -4 0 16 Z" fill="#FFE4D6" stroke="#E07338" stroke-width="2" />
    <!-- Gentle Caring Face -->
    <circle cx="-5" cy="-10" r="2" fill="#293347" />
    <circle cx="5" cy="-10" r="2" fill="#293347" />
    <path d="M-4 -3 Q0 1 4 -3" stroke="#293347" stroke-width="1.6" stroke-linecap="round" fill="none" />
    <text x="0" y="85" font-family="'Nunito', sans-serif" font-weight="850" font-size="11" fill="#E07338" text-anchor="middle">Kindness</text>
  </g>
</svg>
