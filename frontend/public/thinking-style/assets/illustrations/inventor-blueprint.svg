<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%" fill="none" role="img" aria-label="Inventor's Workshop Drafting Blueprint and Creative Isometric Blocks">
  <defs>
    <linearGradient id="iwBg" x1="0" y1="0" x2="500" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF7F2" />
      <stop offset="50%" stop-color="#FFE4D6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFF1BD" stop-opacity="0.5" />
    </linearGradient>
    <filter id="iwShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#E07338" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="500" height="320" rx="20" fill="url(#iwBg)" />

  <!-- Blueprint Drafting Grid Surface -->
  <g transform="translate(250, 155)" filter="url(#iwShadow)">
    <rect x="-170" y="-105" width="340" height="210" rx="16" fill="#DFEDFF" stroke="#2B7BC7" stroke-width="2.5" />
    
    <!-- Blueprint Grid Lines -->
    <path d="M-150 -85 H150 M-150 -55 H150 M-150 -25 H150 M-150 5 H150 M-150 35 H150 M-150 65 H150 M-150 85 H150" stroke="rgba(43, 123, 199, 0.25)" stroke-width="1" />
    <path d="M-130 -85 V85 M-90 -85 V85 M-50 -85 V85 M-10 -85 V85 M30 -85 V85 M70 -85 V85 M110 -85 V85" stroke="rgba(43, 123, 199, 0.25)" stroke-width="1" />

    <!-- Center Isometric 3D Construction Cubes (Pastel Clay Blocks) -->
    <!-- Block 1 (Mint) -->
    <g transform="translate(-40, 20)">
      <polygon points="0,-24 22,-12 0,0 -22,-12" fill="#DDF5E9" stroke="#177A53" stroke-width="1.8" />
      <polygon points="-22,-12 0,0 0,24 -22,12" fill="#BCE9D1" stroke="#177A53" stroke-width="1.8" />
      <polygon points="22,-12 0,0 0,24 22,12" fill="#A1DDBE" stroke="#177A53" stroke-width="1.8" />
    </g>

    <!-- Block 2 (Lavender - Stacked On Top) -->
    <g transform="translate(-40, -28)">
      <polygon points="0,-24 22,-12 0,0 -22,-12" fill="#EAE4FF" stroke="#7C5CDB" stroke-width="1.8" />
      <polygon points="-22,-12 0,0 0,24 -22,12" fill="#D5C7F7" stroke="#7C5CDB" stroke-width="1.8" />
      <polygon points="22,-12 0,0 0,24 22,12" fill="#BFADF2" stroke="#7C5CDB" stroke-width="1.8" />
    </g>

    <!-- Block 3 (Peach - Right Side) -->
    <g transform="translate(4, -4)">
      <polygon points="0,-24 22,-12 0,0 -22,-12" fill="#FFE4D6" stroke="#E07338" stroke-width="1.8" />
      <polygon points="-22,-12 0,0 0,24 -22,12" fill="#FCD0B8" stroke="#E07338" stroke-width="1.8" />
      <polygon points="22,-12 0,0 0,24 22,12" fill="#F7BA98" stroke="#E07338" stroke-width="1.8" />
    </g>

    <!-- Block 4 (Butter Yellow - Base Right) -->
    <g transform="translate(4, 44)">
      <polygon points="0,-24 22,-12 0,0 -22,-12" fill="#FFF1BD" stroke="#C78B12" stroke-width="1.8" />
      <polygon points="-22,-12 0,0 0,24 -22,12" fill="#FEE58F" stroke="#C78B12" stroke-width="1.8" />
      <polygon points="22,-12 0,0 0,24 22,12" fill="#FAD65A" stroke="#C78B12" stroke-width="1.8" />
    </g>

    <!-- Drafting Compass Tool -->
    <g transform="translate(100, -30) rotate(25)">
      <line x1="0" y1="-30" x2="-14" y2="28" stroke="#647184" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="-30" x2="14" y2="28" stroke="#647184" stroke-width="3" stroke-linecap="round" />
      <circle cx="0" cy="-30" r="5" fill="#FFE4D6" stroke="#E07338" stroke-width="2" />
      <circle cx="-14" cy="28" r="2" fill="#177A53" />
      <polygon points="12,28 16,28 14,34" fill="#647184" />
    </g>

    <!-- Measurement Dimension Arc -->
    <path d="M-80 50 A40 40 0 0 1 -40 70" stroke="#E07338" stroke-width="1.5" stroke-dasharray="3 3" fill="none" />
    <text x="-65" y="82" font-family="'Nunito', sans-serif" font-weight="900" font-size="10" fill="#E07338">r = 30cm</text>
  </g>
</svg>
